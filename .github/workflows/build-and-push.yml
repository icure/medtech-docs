# CI: run the production Docusaurus build on every push/PR, then build the Dockerfile.runtime image
# (static-web-server serving the static site) and push it to ghcr.io from main and staging. Replaces the
# Taktik Cloud Build pipeline (ci/cloudbuild.yaml, which synced the build to the gs://docs.icure.com bucket).
#
# Image tags are [staging-]<major>.<minor>.<commit-count> (monotonic — the patch is the git commit count from
# `git rev-list --count HEAD`), plus an immutable [staging-]<major>.<minor>.<commit-count>-<sha7> tag for commit
# traceability, plus `latest` on main. <major>.<minor> comes from package.json `version`. Pushes from staging
# prefix the version tags with `staging-` so they never collide with production tags.
#
# Deployed on the OVH k3s cluster by Flux (k3s-icure-ovh-flux-icure, clusters/production/icure/releases/static/
# medtech-docs*.yaml): bump the image tag there to roll out a new build.

name: Build and push

on:
  push:
    branches: ['main', 'staging']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Fails on broken links (onBrokenLinks: 'throw').
      - name: Production build
        run: NODE_OPTIONS="--max_old_space_size=4096" yarn build

  build-and-push:
    # PRs only run the test job; images are pushed from main and staging.
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history is required so `git rev-list --count` yields the real commit count (the default shallow
          # clone would return 1).
          fetch-depth: 0

      - name: Compute image tags ([staging-]<major>.<minor>.<commit-count>[-<sha7>])
        id: tag
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) prefix='' ;;
            refs/heads/staging) prefix='staging-' ;;
            *) echo "No image is published for $GITHUB_REF" >&2; exit 1 ;;
          esac
          version=$(jq -r .version package.json)
          # Take only <major>.<minor>; the patch slot is the commit count.
          major_minor=$(echo "$version" | cut -d. -f1-2)
          count=$(git rev-list --count HEAD)
          sha7=${GITHUB_SHA::7}
          echo "tag=${prefix}${major_minor}.${count}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${prefix}${major_minor}.${count}-${sha7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/icure/medtech-docs:${{ steps.tag.outputs.tag }}
            ghcr.io/icure/medtech-docs:${{ steps.tag.outputs.sha_tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/icure/medtech-docs:latest' || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/icure/medtech-docs
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
